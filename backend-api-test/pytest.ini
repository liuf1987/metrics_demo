[pytest]
addopts = -vqs --html=./report/index.html --self-contained-html --alluredir=./report/allure --clean-alluredir
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = ./tests
norecursedirs = ./venv
# Disable Unicode escaping to display Chinese characters correctly
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
# Default timeout (seconds) - AI tests use higher timeout
timeout = 60
